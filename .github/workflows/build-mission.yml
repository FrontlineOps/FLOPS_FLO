name: Build FLO Addon

on:
  push:
    branches: [main, Develop, Experimental, Release]
    tags: ["v*", "V*"]
  pull_request:
    branches: [main, Develop, Experimental, Release]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Addon version bump"
        required: false
        default: "none"
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION_BUMP: ${{ inputs.version_bump || 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve addon version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = '.hemtt/project.toml'
          $config = Get-Content -LiteralPath $path -Raw
          $section = [regex]::Match($config, '(?ms)^\[version\]\s*\n(.*?)(?=^\[|\z)')
          if (-not $section.Success) { throw 'Missing HEMTT version section' }
          $parts = @{}
          foreach ($name in @('major', 'minor', 'patch')) {
            $match = [regex]::Match($section.Value, "(?m)^$name\s*=\s*(\d+)\s*$")
            if (-not $match.Success) { throw "Missing version component $name" }
            $parts[$name] = [int]$match.Groups[1].Value
          }
          $releaseVersion = "$($parts.major).$($parts.minor).$($parts.patch)"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $match = [regex]::Match($env:GITHUB_REF_NAME, '^[vV](\d+)\.(\d+)\.(\d+)(-[0-9A-Za-z.-]+)?$')
            if (-not $match.Success) { throw 'Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix' }
            $parts.major = [int]$match.Groups[1].Value
            $parts.minor = [int]$match.Groups[2].Value
            $parts.patch = [int]$match.Groups[3].Value
            $releaseVersion = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:VERSION_BUMP -ne 'none') {
            switch ($env:VERSION_BUMP) {
              'major' { $parts.major++; $parts.minor = 0; $parts.patch = 0 }
              'minor' { $parts.minor++; $parts.patch = 0 }
              'patch' { $parts.patch++ }
              default { throw 'Invalid version bump' }
            }
            $releaseVersion = "$($parts.major).$($parts.minor).$($parts.patch)"
          }
          $updatedSection = $section.Value
          foreach ($name in @('major', 'minor', 'patch')) {
            $updatedSection = [regex]::Replace($updatedSection, "(?m)^$name\s*=\s*\d+\s*$", "$name = $($parts[$name])")
          }
          $config = $config.Substring(0, $section.Index) + $updatedSection + $config.Substring($section.Index + $section.Length)
          [IO.File]::WriteAllText((Join-Path $PWD $path), $config)
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup HEMTT
        uses: arma-actions/hemtt@v1
        with:
          version: 'v1.21.0'

      - name: Check and package addon
        shell: pwsh
        run: |
          hemtt check
          if ($LASTEXITCODE -ne 0) { throw 'HEMTT check failed' }
          hemtt release
          if ($LASTEXITCODE -ne 0) { throw 'HEMTT release failed' }
          if (-not (Test-Path -LiteralPath '.hemttout/release/addons/flo_main.pbo')) { throw 'Missing FLO addon PBO' }
          $archive = @(Get-ChildItem -LiteralPath releases -Filter '*-latest.zip')
          if ($archive.Count -ne 1) { throw 'Expected exactly one HEMTT release archive' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath $archive[0].FullName -Destination "dist/FLO-$env:RELEASE_VERSION.zip"

      - name: Commit requested addon version bump
        if: github.ref_type != 'tag' && github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- .hemtt/project.toml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "[Build] bump addon version to $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Version commit failed' }
          git push
          if ($LASTEXITCODE -ne 0) { throw 'Version push failed' }
          $commit = git rev-parse HEAD
          "Version $env:RELEASE_VERSION committed at $commit. The signed addon is attached to this run. Push tag v$env:RELEASE_VERSION at this commit to publish its release." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # The tag already exists before this run; never create a release tag from a mutable branch tip.
      - name: Create release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}
          files: dist/*.zip

      - name: Upload addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: flo-addon-${{ env.RELEASE_VERSION }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
